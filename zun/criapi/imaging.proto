syntax = "proto3";

// The parts of containerd's diff, content and image services a commit needs.
//
// Same shape as tasks.proto and snapshots.proto beside it: not copies of
// containerd's files, only the calls used, with the field numbers and
// service names they have upstream -- which is all the wire needs to agree
// on. Descriptor and Mount live in containerd.types upstream and are
// declared once here, under names local to this file.
//
// ⚠️ Every call needs the containerd-namespace metadata header.

package zun.criapi.imaging;

import "google/protobuf/empty.proto";

message Descriptor {
  string media_type = 1;
  string digest = 2;
  int64 size = 3;
  map<string, string> annotations = 5;
}

message Mount {
  string type = 1;
  string source = 2;
  string target = 3;
  repeated string options = 4;
}

// ---------------------------------------------------------------- diff

service Diff {
  rpc Diff(DiffRequest) returns (DiffResponse);
}

message DiffRequest {
  repeated Mount left = 1;
  repeated Mount right = 2;
  string media_type = 3;
  string ref = 4;
  map<string, string> labels = 5;
}

message DiffResponse {
  Descriptor diff = 3;
}

// ------------------------------------------------------------- content

service Content {
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc Read(ReadContentRequest) returns (stream ReadContentResponse);
  rpc Write(stream WriteContentRequest) returns (stream WriteContentResponse);
}

message Info {
  string digest = 1;
  int64 size = 2;
}

message InfoRequest {
  string digest = 1;
}

message InfoResponse {
  Info info = 1;
}

message ReadContentRequest {
  string digest = 1;
  int64 offset = 2;
  int64 size = 3;
}

message ReadContentResponse {
  int64 offset = 1;
  bytes data = 2;
}

enum WriteAction {
  STAT = 0;
  WRITE = 1;
  COMMIT = 2;
}

message WriteContentRequest {
  WriteAction action = 1;
  string ref = 2;
  int64 total = 3;
  string expected = 4;
  int64 offset = 5;
  bytes data = 6;
  map<string, string> labels = 7;
}

message WriteContentResponse {
  WriteAction action = 1;
  string ref = 3;
  int64 offset = 4;
  int64 total = 5;
  string digest = 6;
}

// -------------------------------------------------------------- images

service Images {
  rpc Get(GetImageRequest) returns (GetImageResponse);
  rpc Create(CreateImageRequest) returns (CreateImageResponse);
  rpc Delete(DeleteImageRequest) returns (google.protobuf.Empty);
}

message Image {
  string name = 1;
  map<string, string> labels = 2;
  Descriptor target = 3;
}

message GetImageRequest {
  string name = 1;
}

message GetImageResponse {
  Image image = 1;
}

message CreateImageRequest {
  Image image = 1;
}

message CreateImageResponse {
  Image image = 1;
}

message DeleteImageRequest {
  string name = 1;
  bool sync = 2;
}
